version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: polarops_postgres
    restart: always
    environment:
      POSTGRES_USER: polarops
      POSTGRES_PASSWORD: polarops_password
      POSTGRES_DB: polarops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: polarops_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polarops_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://polarops:polarops_password@postgres:5432/polarops_db
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
    depends_on:
      - postgres
      - mosquitto

volumes:
  postgres_data:
